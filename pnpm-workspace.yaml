packages:
  - packages/obsidian-launcher
  - packages/wdio-obsidian-reporter
  - packages/wdio-obsidian-service

linkWorkspacePackages: true
resolutionMode: 'highest'

minimumReleaseAge: 2880 # 2 days
blockExoticSubdeps: true
allowBuilds:
  appium: true
  classic-level: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  sharp: true

