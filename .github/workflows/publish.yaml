# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Trigger this workflow with `pnpm run release patch/minor/major` then `git push && git push origin tag <tag>`
# It uses https://docs.npmjs.com/staged-publishing so to actually publish the package, go to the https://www.npmjs.com
# Staged Packages page and approve to actually publish them
name: Publish
on:
  push:
    tags: ["*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: # Needed for the `--notes-from-tag` option to work
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          PNPM_CONFIG_AGGREGATE_OUTPUT: 'true'
          PNPM_CONFIG_REPORTER_HIDE_PREFIX: 'true'

      - name: Github Release
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" --title="$VERSION" --verify-tag --notes-from-tag $RELEASE_TYPE
        env:
          RELEASE_TYPE: ${{ contains(github.ref, '-') && '--prerelease' || ''}}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: pnpm stage publish -r --aggregate-output --no-git-checks --tag $RELEASE_TYPE
        env:
          RELEASE_TYPE: ${{ contains(github.ref, '-') && 'beta' || 'latest'}}

      - name: Generate docs
        run: pnpm run doc

      - name: Upload docs as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: generated-docs/

  deploy-docs:
    # Skip if prerelease
    if: ${{ !contains(github.ref, '-') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
